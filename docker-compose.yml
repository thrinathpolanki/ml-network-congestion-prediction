# docker compose up --build        ->  API on :8000 (docs at /docs), dashboard on :8501
# Secrets (webhook URL, SMTP password, ...) come from a local .env file, never from this file or the image.
services:
  api:
    build: .
    image: ncp-app:latest
    ports:
      - "127.0.0.1:8000:8000"   # localhost only: the API has no authentication. Use "8000:8000" to expose it on your network.
    env_file:
      - path: .env            # optional; copy .env.example to .env (needs Docker Compose >= 2.24)
        required: false
    environment:
      NCP_LOGGING__LEVEL: ${NCP_LOGGING__LEVEL:-INFO}
    volumes:
      - ncp-logs:/app/logs    # app.log and alert_state.json survive restarts
    restart: unless-stopped

  dashboard:
    image: ncp-app:latest
    pull_policy: never          # the image is built by the api service; do not try to pull it from Docker Hub
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  ncp-logs:
