# =============================================================================
# Central configuration. Override any value with an environment variable:
#   NCP_<SECTION>__<KEY>=value   e.g.  NCP_PREDICTION__HORIZON_MINUTES=60
# =============================================================================
project:
  name: ai-network-congestion-prediction
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/sample
  models_dir: models
  reports_dir: reports
  logs_dir: logs

logging:
  level: INFO
  file: app.log
  max_bytes: 5000000
  backup_count: 3

data:
  sampling_freq: "5min"                 # pandas offset alias
  raw_filename: synthetic_network_traffic.csv
  data_source_label: synthetic          # written into every generated row

prediction:
  horizon_minutes: 30                   # model predicts the state at t + horizon

# -----------------------------------------------------------------------------
# Synthetic data generator (SIMULATED DATA - not real telecom measurements)
# -----------------------------------------------------------------------------
generator:
  n_sites: 20
  start: "2026-01-01"
  end: "2026-03-02"                     # exclusive
  congestion_intensity: 1.0             # >1 = busier network, <1 = quieter
  noise:
    autocorr_minutes: 45                # time constant of AR(1) demand noise
    demand_sigma: 0.09                  # stationary std of log-demand noise
    daily_sigma: 0.07                   # day-to-day level variation
  events:
    spike_rate_per_day: 0.6            # short sudden surges (per site)
    spike_duration_minutes: [10, 45]
    spike_magnitude: [1.25, 1.9]        # multiplier on offered load
    sustained_rate_per_day: 0.15        # long high-utilisation episodes
    sustained_duration_minutes: [120, 360]
    sustained_magnitude: [1.15, 1.4]
  data_quality:
    inject_issues: true                 # create dirty data for the cleaning phase
    anomaly_rate: 0.002                 # sensor/collector glitches (per row)
    missing_value_rate: 0.004           # per metric cell
    duplicate_row_rate: 0.001
    invalid_value_rate: 0.0005          # impossible values (negative, >100 %)
    missing_row_rate: 0.002             # dropped timestamps (gaps)
  location:                             # cells are placed around this centre (change to your own city)
    center_lat: 16.343976
    center_lon: 80.524684
    radius_km: {urban_core: 1.5, business_district: 2.5, urban_residential: 5.0, suburban: 10.0, rural: 18.0}
  regions:
    urban_core:
      {share: 0.20, profile: mixed,       capacity_mbps: 1000, users_at_capacity: 600, peak_load: 1.05, base_latency_ms: 18, sinr_db: 14}
    urban_residential:
      {share: 0.25, profile: residential, capacity_mbps: 800,  users_at_capacity: 450, peak_load: 0.98, base_latency_ms: 22, sinr_db: 15}
    business_district:
      {share: 0.15, profile: business,    capacity_mbps: 900,  users_at_capacity: 500, peak_load: 1.00, base_latency_ms: 16, sinr_db: 17}
    suburban:
      {share: 0.25, profile: residential, capacity_mbps: 500,  users_at_capacity: 250, peak_load: 0.80, base_latency_ms: 28, sinr_db: 13}
    rural:
      {share: 0.15, profile: residential, capacity_mbps: 200,  users_at_capacity: 90,  peak_load: 0.60, base_latency_ms: 40, sinr_db: 9}

# -----------------------------------------------------------------------------
# Small committed sample dataset (scripts/make_sample_data.py): every cell, perfect 5-minute grid
# -----------------------------------------------------------------------------
sample:
  n_sites: 20
  start: "2026-02-24"                   # Tuesday
  end: "2026-02-26"                     # exclusive -> 2 full days (Tue + Wed)
  filename: sample_network_traffic.csv

# -----------------------------------------------------------------------------
# Congestion definition
# Each indicator is mapped to a 0..1 sub-score:  clip((x - good) / (bad - good), 0, 1)
#   x <= good -> 0 (healthy)   x >= bad -> 1 (severely degraded)
# If good > bad the indicator is "lower is worse" (e.g. throughput per user).
# score = (1 - max_blend) * weighted_mean(sub-scores) + max_blend * max(sub-scores)
# The max term makes sure one severely degraded KPI cannot be averaged away.
# -----------------------------------------------------------------------------
labeling:
  max_blend: 0.30
  indicators:
    bandwidth_utilization_pct:   {weight: 0.20, good: 60,  bad: 95}
    latency_ms:                  {weight: 0.15, good: 45,  bad: 200}
    packet_loss_pct:             {weight: 0.20, good: 0.5, bad: 4.0}
    dl_throughput_per_user_mbps: {weight: 0.15, good: 2.0, bad: 0.3}
    jitter_ms:                   {weight: 0.05, good: 5,   bad: 40}
    dropped_call_rate_pct:       {weight: 0.10, good: 0.5, bad: 4.0}
    retransmission_rate_pct:     {weight: 0.05, good: 2,   bad: 12}
    handover_failure_rate_pct:   {weight: 0.05, good: 1,   bad: 6}
    cpu_utilization_pct:         {weight: 0.05, good: 65,  bad: 95}
  # score boundaries between states
  thresholds:
    warning: 0.25
    congested: 0.45
    critical: 0.70

# -----------------------------------------------------------------------------
# Preprocessing
# -----------------------------------------------------------------------------
preprocessing:
  clean_filename: clean_network_traffic.csv
  max_gap_steps: 6              # interpolate gaps up to 6 steps (30 min); longer stay NaN
  outlier:
    enabled: true
    window: 7                   # centred rolling window (steps) for the Hampel test
    # Per-KPI sensitivity. n_sigmas = deviation threshold in robust sigmas;
    # rel_floor = scale never below this fraction of the local median.
    # Noisy, heavy-tailed KPIs get looser limits than smooth ones; chosen by
    # measuring recovery against a clean twin of the synthetic data (see docs).
    columns:
      latency_ms:               {n_sigmas: 8.0, rel_floor: 0.30}
      packet_loss_pct:          {n_sigmas: 8.0, rel_floor: 0.30}
      jitter_ms:                {n_sigmas: 8.0, rel_floor: 0.30}
      download_throughput_mbps: {n_sigmas: 5.0, rel_floor: 0.15}
      upload_throughput_mbps:   {n_sigmas: 5.0, rel_floor: 0.15}
  split:
    train_frac: 0.70            # chronological: first 70 % of the time span
    val_frac: 0.15              # next 15 %; remaining 15 % is the test set

# -----------------------------------------------------------------------------
# Feature engineering  (all windows are in SAMPLING STEPS: 1 step = 5 min)
# -----------------------------------------------------------------------------
features:
  key_kpis:                       # KPIs that get lag / trend / rolling / EWM features
    - bandwidth_utilization_pct
    - latency_ms
    - packet_loss_pct
    - dl_throughput_per_user_mbps
    - active_users
  lags: [1, 2, 3, 6, 12]          # 5, 10, 15, 30, 60 min ago
  roc_steps: [1, 3, 6]            # rate of change = x[t] - x[t-k]
  rolling_windows: [6, 12, 36]    # 30 min, 1 h, 3 h (mean, std, max, min)
  ewm_spans: [3, 12]
  state_lags: [3, 6, 12]          # previous congestion state / score
  congested_frac_windows: [12, 36]  # share of last 1 h / 3 h spent Congested+Critical
  # Derived from the EDA (weekday utilisation >= 70 % of its daily maximum)
  peak_hours: [8, 9, 10, 11, 12, 13, 14, 18, 19, 20, 21, 22]
  processed_prefix: features      # -> data/processed/features_{train,val,test}.parquet
  builder_filename: feature_builder.joblib

# -----------------------------------------------------------------------------
# Evaluation + baselines
# -----------------------------------------------------------------------------
evaluation:
  min_event_steps: 3          # a "congestion event" = >= 3 consecutive congested target steps (15 min)
  event_grace_steps: 3        # event counts as detected if flagged within its first 3 forecast rows
  bootstrap_samples: 300      # day-block bootstrap for confidence intervals
  bootstrap_seed: 42

baselines:
  threshold_feature: bandwidth_utilization_pct   # single-KPI rule, cut-offs fitted on TRAIN only
  seasonal_days: [1, 7]                          # "same time yesterday" / "same time last week"

# -----------------------------------------------------------------------------
# XGBoost
# -----------------------------------------------------------------------------
xgboost:
  model_filename: xgb_congestion.json
  meta_filename: xgb_meta.json
  n_estimators: 600               # upper bound; early stopping decides the real number
  early_stopping_rounds: 25
  n_jobs: null                    # null = all cores
  base_params:
    learning_rate: 0.1
    max_depth: 6
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.6
    reg_lambda: 5
    class_weight_power: 0.5       # sample weight = (n / (4 * class_count)) ** power; 0 = none, 1 = fully balanced
  tuning:
    enabled: true
    n_iter: 8                     # random-search trials (trial 0 = base_params); objective = validation PR-AUC
    seed: 42
    train_stride: 3               # search on every 3rd training row (neighbouring 5-min rows are near-duplicates)
    space:
      max_depth: [4, 6, 8]
      learning_rate: [0.05, 0.1, 0.15]
      min_child_weight: [1, 5, 20]
      subsample: [0.7, 0.9]
      colsample_bytree: [0.4, 0.6, 0.8]
      reg_lambda: [1, 5, 20]
      class_weight_power: [0.0, 0.5, 1.0]
  calibration: isotonic           # isotonic | none  (fitted on validation)
  threshold:
    beta: 2.0                     # F-beta for the alert threshold; beta=2 weighs recall 2x precision
    grid_min: 0.02
    grid_max: 0.98
    grid_points: 97

# -----------------------------------------------------------------------------
# LSTM (PyTorch, CPU)
# -----------------------------------------------------------------------------
lstm:
  seq_len: 36                     # past steps fed to the network (36 x 5 min = 3 h); must be <= 36 to keep XGBoost's rows
  hidden_size: 64
  num_layers: 1
  dropout: 0.2
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  max_epochs: 20
  patience: 4                     # early stopping on weighted validation loss
  windows_per_epoch: 120000       # random subset of training windows per epoch (null = all); bounds CPU time
  class_weight_power: 0.5         # same imbalance handling as XGBoost
  num_threads: null               # null = torch default
  calibration: isotonic
  threshold: {beta: 2.0, grid_min: 0.02, grid_max: 0.98, grid_points: 97}
  model_filename: lstm_congestion.pt
  checkpoint_filename: lstm_checkpoint.pt
  meta_filename: lstm_meta.json
  scaler_filename: lstm_scaler.joblib
